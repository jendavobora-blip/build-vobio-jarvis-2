name: Test and build

on:
  pull_request:
    branches: [feat/jarvis-first-stage]
  push:
    branches: [feat/jarvis-first-stage]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jarvis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:db
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
