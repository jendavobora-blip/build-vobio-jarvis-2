name: Test and build

on:
  pull_request:
    branches: [feat/jarvis-first-stage]
  push:
    branches: [feat/jarvis-first-stage]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
          - 4444:4444
        options: >-
          --health-cmd "pg_isready -U postgres -d jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jarvis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:db
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Start isolated Neon HTTP proxy
        run: |
          docker run -d --rm --name jarvis-test-neon \
            --network container:${{ job.services.postgres.id }} \
            -e PG_CONNECTION_STRING=postgres://postgres:postgres@127.0.0.1:5432/jarvis_test \
            ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
          for attempt in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:4444/sql; then exit 0; fi
            sleep 1
          done
          echo "Neon test proxy is not ready" >&2
          exit 1
      - run: pnpm test:e2e:db
        env:
          JARVIS_TEST_NEON_PROXY_URL: http://127.0.0.1:4444/sql
