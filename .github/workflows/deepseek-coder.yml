name: VOBIO JARVIS - DeepSeek programator

on:
  workflow_dispatch:
    inputs:
      task:
        description: Co ma DeepSeek naprogramovat?
        required: true
        type: string
        default: >-
          Pokracuj v PR #1 od posledniho commitu.
          Dokonci skutecne tool calling, opravneni
          agentu a audit behu. Udelej kod i testy,
          ne jen dalsi plan.
      povoluji_placene_api:
        description: Potvrzuji placene volani DeepSeek API
        required: true
        type: boolean
        default: false
      test_pripojeni:
        description: Pouze jedno kratke testovaci volani DeepSeek API
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vobio-deepseek-coder
  cancel-in-progress: false

jobs:
  kontrola_klice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Overit format DeepSeek secretu bez volani API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          key = os.environ.get('DEEPSEEK_API_KEY', '')
          if not key:
              raise SystemExit('Chybi Secret DEEPSEEK_API_KEY.')
          if not key.isascii() or any(
              char.isspace() or not char.isprintable() for char in key
          ):
              raise SystemExit(
                  'Secret DEEPSEEK_API_KEY obsahuje whitespace nebo '
                  'neplatne znaky; znovu jej ulozte bez mezer a odradkovani.'
              )
          print('Format Secretu DEEPSEEK_API_KEY pro HTTP hlavicku je platny.')
          PY

  test_pripojeni:
    if: ${{ inputs.povoluji_placene_api == true && inputs.test_pripojeni == true }}
    needs: kontrola_klice
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Jedno kratke volani DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os

          body = json.dumps({
              'model': 'deepseek-flash',
              'messages': [{'role': 'user', 'content': 'Reply OK.'}],
              'max_tokens': 16,
              'thinking': {'type': 'disabled'},
              'stream': False,
          })
          connection = http.client.HTTPSConnection('api.deepseek.com', timeout=30)
          try:
              connection.request('POST', '/chat/completions', body, {
                  'Authorization': 'Bearer ' + os.environ['DEEPSEEK_API_KEY'],
                  'Content-Type': 'application/json',
              })
              response = connection.getresponse()
              if response.status != 200:
                  raise SystemExit(f'DeepSeek API vratilo HTTP {response.status}.')
              raw = response.read(65537)
              if len(raw) > 65536:
                  raise SystemExit('DeepSeek API vratilo prilis velkou odpoved.')
              result = json.loads(raw)
              if not isinstance(result, dict):
                  raise SystemExit('DeepSeek API vratilo neplatnou odpoved.')
              choices = result.get('choices')
              usage = result.get('usage')
              if not isinstance(choices, list) or not choices or not isinstance(choices[0], dict):
                  raise SystemExit('DeepSeek API vratilo neplatnou odpoved.')
              message = choices[0].get('message')
              if not isinstance(message, dict) or not isinstance(message.get('content'), str) or not message['content'].strip():
                  raise SystemExit('DeepSeek API vratilo neplatnou odpoved.')
              if not isinstance(usage, dict) or not all(
                  type(usage.get(name)) is int and usage[name] >= 0
                  for name in ('prompt_tokens', 'completion_tokens')
              ):
                  raise SystemExit('DeepSeek API nevratilo platne udaje o spotrebe.')
              print(
                  f"Pripojeni OK; vstupni tokeny: {usage['prompt_tokens']}; "
                  f"vystupni tokeny: {usage['completion_tokens']}."
              )
          except (OSError, http.client.HTTPException, ValueError):
              raise SystemExit('DeepSeek API test selhal kvuli siti nebo neplatne odpovedi.') from None
          finally:
              connection.close()
          PY

  programator:
    if: ${{ inputs.povoluji_placene_api == true && inputs.test_pripojeni == false }}
    needs: kontrola_klice
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Nacist posledni kod PR 1
        uses: actions/checkout@v4
        with:
          ref: feat/jarvis-first-stage
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstalovat Aider
        run: |
          python -m pip install --disable-pip-version-check aider-chat==0.86.2

      - name: DeepSeek naprogramuje dalsi etapu
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: https://api.deepseek.com
          AIDER_ENV_FILE: /dev/null
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "Chybi Secret DEEPSEEK_API_KEY" >&2
            exit 1
          fi

          cat > /tmp/task.txt <<'INSTRUCTIONS'
          Jsi autonomni programator VOBIO JARVIS.

          Navaz na existujici PR #1.
          Respektuj AGENTS.md a IMPLEMENTATION_PLAN.md.

          Implementuj skutecne funkcni kod.
          Dokonci jednu overitelnou vyvojovou etapu.
          Pridej automaticke testy.

          Neopakuj dokoncene ukoly.
          Neaktivuj produkci ani zivy AI backend.
          Nemen GitHub Actions ani tajne klice.
          Neupravuj .env ani produkcni konfiguraci.
          Nemen zavislosti bez schvaleni.
          Nespoustej shell prikazy.

          Prioritne dokonci:
          - Multiagentni orchestraci
          - Skutecne tool calling
          - Audit a opravneni agentu
          - Development Studio
          - Bezpecne kodovaci agenty

          Pokud nelze vse stihnout, dokonci nejblizsi
          smysluplnou etapu a popis dalsi krok.
          INSTRUCTIONS

          printf '\nUKOL:\n%s\n' "$TASK" >> /tmp/task.txt

          aider \
            --model deepseek/deepseek-flash \
            --message-file /tmp/task.txt \
            --read AGENTS.md \
            --no-auto-commits \
            --no-gitignore \
            --input-history-file /dev/null \
            --chat-history-file /dev/null \
            --map-tokens 0 \
            --no-suggest-shell-commands \
            --no-auto-test \
            --no-auto-lint \
            --no-stream \
            --yes-always \
            app/api/chat/route.ts \
            lib/server/orchestrator.ts \
            lib/server/deepseek.ts \
            lib/jarvis/agents.ts \
            tests/orchestrator.integration.ts \
            docs/IMPLEMENTATION_PLAN.md \
            2>&1 | tee /tmp/aider-output.log

          if grep -Eq '^litellm\.[[:alnum:]_]*Error:' /tmp/aider-output.log; then
            echo "DeepSeek vratil chybu API; beh nebude oznacen jako uspesny." >&2
            exit 1
          fi

          if [ -z "$(git status --porcelain -- app components hooks lib tests docs)" ]; then
            echo "Aider nevytvoril zadne zmeny; beh nebude pokracovat jako uspesny." >&2
            exit 1
          fi

      - name: Bezpecnostni kontrola zmen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python - <<'PY'
          import os
          import subprocess

          modified = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD']
          ).decode().split('\0')

          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others',
               '--exclude-standard', '-z']
          ).decode().split('\0')

          allowed = (
              'app/', 'components/', 'hooks/',
              'lib/', 'tests/', 'docs/'
          )

          for path in set(modified + untracked) - {''}:
              if not path.startswith(allowed):
                  raise SystemExit(
                      f'Nepovolena zmena: {path}'
                  )
              if os.path.islink(path):
                  raise SystemExit(
                      f'Nepovoleny symlink: {path}'
                  )

          print('Bezpecnostni kontrola prosla')
          PY

      - name: Nainstalovat pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Nastavit Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Automaticke testovani
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm test:integration
          pnpm typecheck
          pnpm build

      - name: Vytvorit Pull Request ke schvaleni
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: feat/jarvis-first-stage
          branch: ai/deepseek-vobio-navrh
          draft: true
          commit-message: 'feat: DeepSeek navrh pro VOBIO'
          title: 'VOBIO JARVIS - DeepSeek navrh'
          body: |
            Navazuje na existujici PR #1.
            Zmeny byly pripraveny AI agentem.
            Pred sloucenim zkontrolovat kod a testy.
            Produkce nebyla nasazena.
          add-paths: |
            app
            components
            hooks
            lib
            tests
            docs
