name: VOBIO JARVIS - DeepSeek programator

on:
  workflow_dispatch:
    inputs:
      task:
        description: Co ma DeepSeek naprogramovat?
        required: true
        type: string
        default: >-
          Implementuj perzistentní tenant-scoped audit orchestrace a serverově
          vynucený seznam nástrojových oprávnění jednotlivých agentů. Nejdříve
          ověř aktuální implementační plán, zachovej kompatibilitu a přidej
          regresní integrační testy izolace, zamítnutého nástroje a obnovy běhu.
          Neaktivuj živý backend ani produkci.
      povoluji_placene_api:
        description: Potvrzuji placena volani DeepSeek API v uvedenem limitu
        required: true
        type: boolean
        default: false
      test_pripojeni:
        description: Jedno kratke Chat Completions volani pres rozpoctovy limit
        required: true
        type: boolean
        default: false
      overit_zustatek:
        description: Pouze bezplatna kontrola dostupneho USD zustatku
        required: true
        type: boolean
        default: false
      max_spend_usd:
        description: Tvrdý limit USD pro tento běh; 0.00 zakazuje placená volání
        required: true
        type: string
        default: "0.00"
      potvrzuji_cenik:
        description: Ověřil jsem aktuální oficiální ceník DeepSeek
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vobio-deepseek-coder
  cancel-in-progress: false

jobs:
  kontrola_klice:
    if: ${{ inputs.overit_zustatek == true || inputs.povoluji_placene_api == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Overit format DeepSeek secretu bez volani API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          key = os.environ.get('DEEPSEEK_API_KEY', '')
          if not key:
              raise SystemExit('Chybi Secret DEEPSEEK_API_KEY.')
          if not key.isascii() or any(
              char.isspace() or not char.isprintable() for char in key
          ):
              raise SystemExit(
                  'Secret DEEPSEEK_API_KEY obsahuje whitespace nebo '
                  'neplatne znaky; znovu jej ulozte bez mezer a odradkovani.'
              )
          print('Format Secretu DEEPSEEK_API_KEY pro HTTP hlavicku je platny.')
          PY

  test_rozpoctoveho_guardu:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy rozpočtové brány bez API
        run: python3 -B .github/scripts/test_deepseek_budget_proxy.py

  kontrola_rozpoctu:
    if: ${{ inputs.overit_zustatek == true || inputs.povoluji_placene_api == true }}
    needs: [kontrola_klice, test_rozpoctoveho_guardu]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ověřit USD zůstatek bez zveřejnění částky
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          PAID_RUN: ${{ inputs.povoluji_placene_api }}
          PRICE_CONFIRMED: ${{ inputs.potvrzuji_cenik }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PAID_RUN" = "true" ]; then
            if [ "$PRICE_CONFIRMED" != "true" ]; then
              echo "Před placeným během potvrďte aktuální oficiální ceník." >&2
              exit 1
            fi
            python3 .github/scripts/deepseek_budget_proxy.py check-balance \
              --limit-usd "$MAX_SPEND_USD"
          else
            python3 .github/scripts/deepseek_budget_proxy.py check-balance \
              --require-positive
          fi

  test_pripojeni:
    if: ${{ inputs.povoluji_placene_api == true && inputs.test_pripojeni == true }}
    needs: [kontrola_klice, kontrola_rozpoctu]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jedno volání přes tvrdý rozpočtový limit
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          AUDIT_FILE: ${{ github.workspace }}/deepseek-budget-audit.json
        shell: bash
        run: |
          python3 .github/scripts/deepseek_budget_proxy.py smoke-test \
            --limit-usd "$MAX_SPEND_USD" \
            --state-file "$AUDIT_FILE"
      - name: Shrnutí a audit tokenů
        if: always()
        run: |
          test -f deepseek-budget-audit.json
          printf '### DeepSeek rozpočtový audit\n' >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; d=json.load(open("deepseek-budget-audit.json")); print("- API volání: {api_calls}\n- Odmítnutá volání: {denied_calls}\n- Limit USD: {budget_limit_usd}\n- Celkem započteno proti limitu USD: {spent_usd}\n- Ověřená skutečná spotřeba USD: {actual_spent_usd}\n- Konzervativní rezervace při chybách USD: {failed_reserved_usd}\n- Nevyřízená rezervace USD: {reserved_usd}\n- Vstupní tokeny: {prompt_tokens}\n- Výstupní tokeny: {completion_tokens}\n- HTTP chyby poskytovatele: {provider_http_errors}\n- Transportní chyby poskytovatele: {provider_transport_errors}\n- Chyby formátu odpovědi: {provider_response_errors}\n- Selhání/zastavení: {}".format(d["failed"] or d["blocked"], **d)); raise SystemExit(1 if d["failed"] or d["blocked"] or not d["all_reservations_settled"] else 0)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-budget-audit
          path: deepseek-budget-audit.json
          if-no-files-found: ignore

  programator:
    if: ${{ inputs.povoluji_placene_api == true && inputs.test_pripojeni == false }}
    needs: [kontrola_klice, kontrola_rozpoctu, test_rozpoctoveho_guardu]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Nacist posledni kod vyvojove vetve
        uses: actions/checkout@v4
        with:
          ref: feat/jarvis-first-stage
          fetch-depth: 0
          persist-credentials: false

      - name: Zaznamenat vychozi commit
        run: |
          set -euo pipefail
          echo "Vývojový základ: $(git rev-parse HEAD)"
          echo "Požadovaný ref: feat/jarvis-first-stage"

      - name: Načíst rozpočtový proxy z revize workflow
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/deepseek_budget_proxy.py" \
            > /tmp/deepseek_budget_proxy.py
          git show "$GITHUB_SHA:.github/scripts/deepseek-aider-model-settings.yml" \
            > /tmp/deepseek-aider-model-settings.yml

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstalovat Aider
        run: python -m pip install --disable-pip-version-check aider-chat==0.86.2

      - name: DeepSeek naprogramuje dalsi etapu
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          AUDIT_FILE: ${{ github.workspace }}/deepseek-budget-audit.json
          AIDER_ENV_FILE: /dev/null
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "Chybi Secret DEEPSEEK_API_KEY" >&2
            exit 1
          fi

          cat > /tmp/task.txt <<'INSTRUCTIONS'
          Jsi autonomni programator VOBIO JARVIS.
          Implementuj pouze jednu konkretni etapu a testy.
          Respektuj AGENTS.md a docs/IMPLEMENTATION_PLAN.md.
          Nikdy nemen workflow, tajne udaje ani produkcni nastaveni.
          Neaktivuj zivy backend, produkci ani dalsi platby.
          Nespoustej shell prikazy a neodhaluj environment variables.
          INSTRUCTIONS
          printf '\nUKOL:\n%s\n' "$TASK" >> /tmp/task.txt

          python3 /tmp/deepseek_budget_proxy.py run-aider \
            --limit-usd "$MAX_SPEND_USD" \
            --state-file "$AUDIT_FILE" \
            -- \
            aider \
              --model deepseek/deepseek-flash \
              --model-settings-file /tmp/deepseek-aider-model-settings.yml \
              --timeout 75 \
              --analytics-disable \
              --no-check-update \
              --message-file /tmp/task.txt \
              --read AGENTS.md \
              --no-auto-commits \
              --no-gitignore \
              --input-history-file /dev/null \
              --chat-history-file /dev/null \
              --map-tokens 0 \
              --no-suggest-shell-commands \
              --no-auto-test \
              --no-auto-lint \
              --no-stream \
              --yes-always \
              app/api/chat/route.ts \
              lib/server/orchestrator.ts \
              lib/server/deepseek.ts \
              lib/jarvis/agents.ts \
              tests/orchestrator.integration.ts \
              docs/IMPLEMENTATION_PLAN.md \
            2>&1 | tee /tmp/aider-output.log

          if grep -Eq '^litellm\.[[:alnum:]_]*Error:' /tmp/aider-output.log; then
            echo "DeepSeek vratil chybu API; beh nebude oznacen jako uspesny." >&2
            exit 1
          fi

          if [ -z "$(git status --porcelain -- app components hooks lib tests docs)" ]; then
            echo "Aider nevytvoril zadne zmeny; beh nebude pokracovat jako uspesny." >&2
            exit 1
          fi

      - name: Bezpecnostni kontrola zmen
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import os
          import subprocess

          modified = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD']
          ).decode().split('\0')
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard', '-z']
          ).decode().split('\0')
          allowed = ('app/', 'components/', 'hooks/', 'lib/', 'tests/', 'docs/')
          for path in set(modified + untracked) - {''}:
              if not path.startswith(allowed) or os.path.islink(path):
                  raise SystemExit(f'Nepovolena změna: {path}')
          PY

      - name: Nainstalovat pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Automatické testování
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm test:integration
          pnpm typecheck
          pnpm audit --prod
          pnpm build
          pnpm exec playwright install chromium
          pnpm test:e2e

      - name: Odeslat rozpočtový audit
        if: always()
        run: |
          test -f deepseek-budget-audit.json
          printf '### DeepSeek rozpočtový audit\n' >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; d=json.load(open("deepseek-budget-audit.json")); print("- API volání: {api_calls}\n- Odmítnutá volání: {denied_calls}\n- Limit USD: {budget_limit_usd}\n- Celkem započteno proti limitu USD: {spent_usd}\n- Ověřená skutečná spotřeba USD: {actual_spent_usd}\n- Konzervativní rezervace při chybách USD: {failed_reserved_usd}\n- Nevyřízená rezervace USD: {reserved_usd}\n- Vstupní tokeny: {prompt_tokens}\n- Výstupní tokeny: {completion_tokens}\n- HTTP chyby poskytovatele: {provider_http_errors}\n- Transportní chyby poskytovatele: {provider_transport_errors}\n- Chyby formátu odpovědi: {provider_response_errors}\n- Selhání/zastavení: {}".format(d["failed"] or d["blocked"], **d)); raise SystemExit(1 if d["failed"] or d["blocked"] or not d["all_reservations_settled"] else 0)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-budget-audit
          path: deepseek-budget-audit.json
          if-no-files-found: ignore

      - name: Vytvorit Pull Request ke schvaleni
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: feat/jarvis-first-stage
          branch: ai/deepseek-stage-${{ github.run_id }}
          draft: true
          commit-message: "feat: DeepSeek implementacni etapa"
          title: "VOBIO JARVIS - DeepSeek implementacni etapa"
          body: |
            Změny vytvořil DeepSeek přes rozpočtově omezený workflow.
            PR je návrh ke kontrole; automatické sloučení a produkční deploy jsou zakázány.
          add-paths: |
            app
            components
            hooks
            lib
            tests
            docs
